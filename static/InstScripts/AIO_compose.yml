services:
  frontend:
    image: ghcr.io/rgss-cs/williams-rgss-website-dev-frontend/frontend:latest
    container_name: frontend
    expose:
      - "3000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - internetwork
    pull_policy: always

  backend:
    image: ghcr.io/rgss-cs/backend:sha-230b10f
    container_name: backend
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks:
      - internetwork
      - backend-net
    pull_policy: always

  db:
    image: postgres:17-alpine
    container_name: backend-postgresql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
    networks:
      - internetwork


volumes:
  postgres_data:
  media:

networks:
  internetwork:
    external: true

  backend-net:
    driver: bridge
